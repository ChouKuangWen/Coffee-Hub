# Preserve original seed URLs in MySQL; block external image requests in browsers.
# Missing or blocked images use the existing Vue placeholder.
add_header Content-Security-Policy "img-src 'self' data:;" always;

# One product ID, one local file. Missing files return 404, never SPA HTML.
location ~ ^/images/products/product-(?<demo_product_id>[1-9][0-9]*)$ {
    try_files /images/products/product-$demo_product_id.webp
              /images/products/product-$demo_product_id.png
              /images/products/product-$demo_product_id.jpg
              /images/products/product-$demo_product_id.jpeg =404;
}

location /images/products/ {
    try_files $uri =404;
}
